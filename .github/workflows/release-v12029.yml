name: Publish IG Cleaner Android v120.29

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v12029.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android beta
        run: gradle :app:assembleDebug

      - name: Verify embedded Workspace
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep "assets/ig_cleaner_workspace.html"
          test "$(unzip -l "$APK" | awk '/assets\/ig_cleaner_workspace.html/{print $1}')" -gt 1500000

      - name: Prepare release assets
        working-directory: .
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/IG_Cleaner_Companion_v120.29-beta.apk
          cd release-assets
          sha256sum IG_Cleaner_Companion_v120.29-beta.apk > SHA256SUMS.txt
          ls -lh

      - name: Publish v120.29 pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v120.29 >/dev/null 2>&1; then
            echo "Release v120.29 already exists."
            exit 0
          fi

          gh release create v120.29 \
            release-assets/IG_Cleaner_Companion_v120.29-beta.apk \
            release-assets/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "IG Cleaner v120.29 — Full Android Workspace Beta" \
            --notes "Android now includes the full IG Cleaner workspace plus native mobile Focus, Audit and Account.

          Included:
          - Home / Command Center
          - Review
          - Mutuals
          - Followers
          - Pending
          - Import
          - Insights
          - Changes
          - Vault
          - Health
          - About
          - Native Focus checklist
          - Native Audit
          - Native account/sync

          Mobile behavior:
          - ZIP/JSON/HTML files can be selected on Android.
          - Instagram profiles open externally.
          - Desktop-style multi-profile Focus actions redirect to Mobile Focus so Android opens profiles one at a time.
          - Supabase session/device identity is shared with the embedded Workspace.
          - System-bar overlap from v120.28 is corrected.

          This remains beta until validated on the target phone."
