name: Publish IG Cleaner Android v120.29

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v12029.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android beta
        run: gradle :app:assembleDebug

      - name: Verify embedded Workspace
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          LEGACY="assets/ig_cleaner_workspace.html"
          unzip -l "$APK" | grep "$OFFICIAL"
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 1500000
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is still packaged: $LEGACY"
            exit 1
          fi

      - name: Prepare release assets
        working-directory: .
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/IG_Cleaner_Companion_v120.29-beta.apk
          cd release-assets
          sha256sum IG_Cleaner_Companion_v120.29-beta.apk > SHA256SUMS.txt
          ls -lh

      - name: Publish or refresh v120.29 pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v120.29"
          TITLE="IG Cleaner v120.29 — Full Android Workspace Beta"

          cat > release-assets/RELEASE_NOTES.md <<'EOF'
          Android now includes the full IG Cleaner workspace plus native mobile Focus, Audit and Account.

          Included:
          - Home / Command Center
          - Review
          - Mutuals
          - Followers
          - Pending
          - Import
          - Insights
          - Changes
          - Vault
          - Health
          - About
          - Native Focus checklist
          - Native Audit
          - Native account/sync

          Mobile behavior:
          - ZIP/JSON/HTML files can be selected on Android.
          - Instagram profiles open externally.
          - Desktop-style multi-profile Focus actions redirect to Mobile Focus so Android opens profiles one at a time.
          - Supabase session/device identity is shared with the embedded Workspace.
          - System-bar overlap from v120.28 is corrected.
          - The APK now packages exactly one official Desktop Workspace asset.
          - CI rejects missing, undersized or duplicated Workspace assets.

          This remains a beta release until validated on the target phone.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refreshing existing $TAG release."
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
            gh release upload "$TAG" \
              release-assets/IG_Cleaner_Companion_v120.29-beta.apk \
              release-assets/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" \
              --prerelease \
              --title "$TITLE" \
              --notes-file release-assets/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              release-assets/IG_Cleaner_Companion_v120.29-beta.apk \
              release-assets/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes-file release-assets/RELEASE_NOTES.md
          fi
