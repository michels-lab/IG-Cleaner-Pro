name: Build IG Cleaner Companion

on:
  workflow_dispatch:
  push:
    branches: ["android-*"]
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug
      - name: Verify embedded Workspace asset
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          LEGACY="assets/ig_cleaner_workspace.html"
          unzip -l "$APK" | grep "$OFFICIAL"
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 1500000
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is still packaged: $LEGACY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish v120.30 prerelease
        if: github.ref_name == 'android-full-sync-v120.30'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="IG-Cleaner-v120.30-beta.apk"
          cp "$APK" "$RELEASE_APK"

          NOTES=Android v120.30 beta\n\n- One Cuenta/login experience on Android.\n- Hardened Supabase session refresh and WebView/native session sharing.\n- Full Following, Followers and Pending list snapshots sync from Desktop to Android.\n- Review, Mutuals, Followers and Pending can reconstruct the same people on Android.\n\nValidation: GitHub Actions build + embedded Workspace verification passed. Device round-trip validation is still pending.'

          if gh release view v120.30 >/dev/null 2>&1; then
            gh release edit v120.30 --title "IG Cleaner v120.30 Beta" --notes "$NOTES" --prerelease
            gh release upload v120.30 "$RELEASE_APK" --clobber
          else
            gh release create v120.30 "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "IG Cleaner v120.30 Beta" \
              --notes "$NOTES" \
              --prerelease
          fi
