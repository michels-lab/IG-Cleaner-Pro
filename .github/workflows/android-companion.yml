name: Validate Instagram Cleaner Pro

on:
  workflow_dispatch:
  push:
    branches: ["main", "android-*", "release-*"]
    paths:
      - "android/**"
      - "desktop/**"
      - "branding/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Desktop JavaScript
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile, sys
          html = pathlib.Path("desktop/ig_cleaner_pro_v120_27_synced_companion.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.I|re.S)
          checked = 0
          for i, (attrs, code) in enumerate(scripts):
              m = re.search(r'type=["\']([^"\']+)["\']', attrs, flags=re.I)
              if m and "javascript" not in m.group(1).lower() and "ecmascript" not in m.group(1).lower():
                  continue
              if not code.strip():
                  continue
              path = pathlib.Path(tempfile.gettempdir()) / f"igc-inline-{i}.js"
              path.write_text(code, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  sys.exit(result.returncode)
              checked += 1
          print(f"Validated {checked} inline JavaScript blocks.")
          assert 'Instagram Cleaner Pro' in html
          assert 'normalizeLegacyReviewState' in html
          assert 'igcQueueStateSync' in html
          PY

      - run: gradle :app:assembleDebug
      - name: Verify embedded Workspace asset
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          LEGACY="assets/ig_cleaner_workspace.html"
          unzip -l "$APK" | grep "$OFFICIAL"
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 1500000
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is still packaged: $LEGACY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

