name: Build IG Cleaner Companion

on:
  workflow_dispatch:
  push:
    branches: ["android-*", "release-*", "release/**"]
    paths:
      - "android/**"
      - "desktop/**"
      - ".github/workflows/android-companion.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug
      - name: Verify embedded Workspace asset
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          PORTRAIT="assets/assets/michel_duarte_avatar.jpg"
          LAB_LOCKUP="assets/assets/michels-lab/official-lockup.png"
          LEGACY="assets/ig_cleaner_workspace.html"
          unzip -l "$APK" | grep "$OFFICIAL"
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 700000
          unzip -p "$APK" "$PORTRAIT" > /tmp/igc-portrait.jpg
          unzip -p "$APK" "$LAB_LOCKUP" > /tmp/igc-lab-lockup.png
          cmp /tmp/igc-portrait.jpg ../desktop/assets/michel_duarte_avatar.jpg
          cmp /tmp/igc-lab-lockup.png ../desktop/assets/michels-lab/official-lockup.png
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is still packaged: $LEGACY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
