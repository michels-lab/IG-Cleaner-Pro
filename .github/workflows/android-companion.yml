name: Build IG Cleaner Companion

on:
  workflow_dispatch:
  push:
    branches: ["android-*"]
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug
      - name: Verify embedded Workspace asset
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          LEGACY="assets/ig_cleaner_workspace.html"
          unzip -l "$APK" | grep "$OFFICIAL"
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 1500000
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is still packaged: $LEGACY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish v120.32 prerelease
        if: github.ref_name == 'android-native-workspace-v120.32'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="IG-Cleaner-v120.32-beta.apk"
          RELEASE_DESKTOP="IG-Cleaner-v120.32-Desktop.html"
          cp "$APK" "$RELEASE_APK"
          cp "../desktop/ig_cleaner_pro_v120_27_synced_companion.html" "$RELEASE_DESKTOP"

          cat > release-notes.md <<'EOF'
          Android v120.32 beta

          - Desktop-derived visual system: exact core palette, IG brand mark, typography hierarchy and compact mobile surfaces.
          - Native Home and Review navigation with cached restoration, pull-to-refresh, search and direct Instagram opening.
          - Password-first Profile sign-in; OTP is reserved for first-time setup and password recovery.
          - Following, Followers, Pending, review/protected/snoozed state and profile_state are merged for consistent counts across devices.
          - Friendly session/network states replace raw HTTP/token errors and cached data stays visible during refresh.
          - Advanced Desktop tools remain available from the overflow menu instead of dominating the mobile UI.

          Validation: GitHub Actions build + embedded advanced Workspace verification passed.
          EOF

          if gh release view v120.32 >/dev/null 2>&1; then
            gh release edit v120.32 --title "IG Cleaner v120.32 Beta" --notes-file release-notes.md --prerelease
            gh release upload v120.32 "$RELEASE_APK" "$RELEASE_DESKTOP" --clobber
          else
            gh release create v120.32 "$RELEASE_APK" "$RELEASE_DESKTOP" \
              --target "$GITHUB_SHA" \
              --title "IG Cleaner v120.32 Beta" \
              --notes-file release-notes.md \
              --prerelease
          fi
