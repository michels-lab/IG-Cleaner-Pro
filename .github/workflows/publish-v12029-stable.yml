name: Publish IG Cleaner Pro v120.29 Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/release-v12029.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Desktop and branding contracts
        run: |
          node tests/desktop-contract.test.cjs
          python tests/fixture-contract.py
          python tests/branding-contract.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android beta companion
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Verify packaged Workspace
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          LEGACY="assets/ig_cleaner_workspace.html"
          COUNT="$(unzip -l "$APK" | grep -c "$OFFICIAL" || true)"
          test "$COUNT" -eq 1
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 1500000
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is packaged: $LEGACY"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          cp desktop/ig_cleaner_pro_v120_27_synced_companion.html release-assets/IG-Cleaner-Pro-v120.29-Desktop.html
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/IG-Cleaner-Pro-v120.29-Android-beta.apk
          cp branding/ig-cleaner-pro/official-app-icon.svg release-assets/IG-Cleaner-Pro-logo.svg
          cd release-assets
          sha256sum IG-Cleaner-Pro-v120.29-Desktop.html IG-Cleaner-Pro-v120.29-Android-beta.apk IG-Cleaner-Pro-logo.svg > SHA256SUMS.txt

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v120.29"
          TITLE="IG Cleaner Pro v120.29 — Official Branding & Hardened Distribution"

          cat > release-assets/RELEASE_NOTES.md <<'EOF'
          IG Cleaner Pro v120.29 is the current stable GitHub release of the local-first Desktop workspace.

          Highlights:
          - Official IG Cleaner Pro identity across Desktop and Android surfaces.
          - Official favicon/shortcut, startup, in-app, launcher and About branding.
          - Unified Desktop + Android CI.
          - Browser-state migration and distribution contract.
          - Auditable sanitized Instagram export fixtures.
          - Release publication separated from ordinary main-branch CI.
          - SHA-256 checksums for distributed artifacts.

          Included artifacts:
          - IG-Cleaner-Pro-v120.29-Desktop.html — self-contained Desktop/local-Web app.
          - IG-Cleaner-Pro-v120.29-Android-beta.apk — Android beta companion.
          - IG-Cleaner-Pro-logo.svg — official app icon source.
          - SHA256SUMS.txt.

          Android remains a beta companion pending target-device and production-store validation. The GitHub release itself is stable for the Desktop/local-Web product.
          EOF

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" -y
            done
            gh release upload "$TAG"               release-assets/IG-Cleaner-Pro-v120.29-Desktop.html               release-assets/IG-Cleaner-Pro-v120.29-Android-beta.apk               release-assets/IG-Cleaner-Pro-logo.svg               release-assets/SHA256SUMS.txt
            gh release edit "$TAG"               --title "$TITLE"               --notes-file release-assets/RELEASE_NOTES.md               --prerelease=false               --latest
          else
            gh release create "$TAG"               release-assets/IG-Cleaner-Pro-v120.29-Desktop.html               release-assets/IG-Cleaner-Pro-v120.29-Android-beta.apk               release-assets/IG-Cleaner-Pro-logo.svg               release-assets/SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "$TITLE"               --notes-file release-assets/RELEASE_NOTES.md               --latest
          fi
