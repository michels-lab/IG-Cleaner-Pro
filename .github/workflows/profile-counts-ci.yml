name: Profile Counts feature tests
on:
  pull_request:
    paths:
      - 'tools/profile_counts_robot.py'
      - 'tools/profile_counts_bridge.py'
      - 'tools/profile_actions.py'
      - 'tools/profile_lists_live.py'
      - 'tools/live_relationship_snapshot.py'
      - 'tests/test_live_relationship_snapshot.py'
      - 'tests/test_live_relationship_bridge.py'
      - 'tests/test_profile_lists_live.py'
      - 'tools/instagram_unfollow_reference.py'
      - 'tests/test_instagram_unfollow_reference.py'
      - 'tests/test_action_reference_worker_contract.py'
      - 'tests/owner-unfollow-transport.test.cjs'
      - 'tests/test_action_click_wal.py'
      - 'tests/test_action_owner_probe_bound.py'
      - 'tests/test_action_worker_journal_gate.py'
      - 'tools/robot_interlock.py'
      - 'tests/test_robot_interlock.py'
      - 'tools/profile_counts_pacing.py'
      - 'tools/profile_counts_instagram.py'
      - 'desktop/ig_cleaner_pro_v120_27_synced_companion.html'
      - 'tests/test_profile_counts_robot.py'
      - 'tests/test_profile_counts_bridge.py'
      - 'tests/test_profile_counts_pacing.py'
      - 'tests/test_granada_pacing_integrity.py'
      - 'tests/test_granada_false_success_resume.py'
      - 'tests/test_granada_csv_recovery.py'
      - 'tests/profile-counts-ui.test.cjs'
      - 'packaging/chrome-extension/**'
      - 'tests/chrome-companion.test.cjs'
      - 'tests/automations-planner.test.cjs'
      - 'tests/automations-execution.test.cjs'
      - 'tests/automations-issues.test.cjs'
      - 'tests/test_profile_counts_actions.py'
      - 'tests/test_profile_counts_recaptcha.py'
      - 'tests/mutual-focus-ratio.test.cjs'
      - '.github/workflows/profile-counts-ci.yml'
  push:
    branches:
      - 'feat/profile-counts-queue-20261011'
    paths:
      - 'tools/profile_counts_robot.py'
      - 'tools/profile_counts_bridge.py'
      - 'tools/profile_actions.py'
      - 'tools/profile_lists_live.py'
      - 'tools/live_relationship_snapshot.py'
      - 'tests/test_live_relationship_snapshot.py'
      - 'tests/test_live_relationship_bridge.py'
      - 'tests/test_profile_lists_live.py'
      - 'tools/instagram_unfollow_reference.py'
      - 'tests/test_instagram_unfollow_reference.py'
      - 'tests/test_action_reference_worker_contract.py'
      - 'tests/owner-unfollow-transport.test.cjs'
      - 'tests/test_action_click_wal.py'
      - 'tests/test_action_owner_probe_bound.py'
      - 'tests/test_action_worker_journal_gate.py'
      - 'tools/robot_interlock.py'
      - 'tests/test_robot_interlock.py'
      - 'tools/profile_counts_pacing.py'
      - 'tools/profile_counts_instagram.py'
      - 'desktop/ig_cleaner_pro_v120_27_synced_companion.html'
      - 'tests/test_profile_counts_robot.py'
      - 'tests/test_profile_counts_bridge.py'
      - 'tests/test_profile_counts_pacing.py'
      - 'tests/test_granada_pacing_integrity.py'
      - 'tests/test_granada_false_success_resume.py'
      - 'tests/test_granada_csv_recovery.py'
      - 'tests/profile-counts-ui.test.cjs'
      - '.github/workflows/profile-counts-ci.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python profile counts parsing, queue and resume
        run: python -m unittest discover -s tests -p 'test_profile_counts_*.py' -v
      - name: Optional live Followers and Following lists fail-closed pagination
        run: python -m unittest discover -s tests -p 'test_profile_lists_live.py' -v
      - name: GRANADA independent live Followers/Following snapshots, partial pages and local bridge
        run: |
          python -m unittest discover -s tests -p 'test_live_relationship_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_live_relationship_bridge.py' -v
      - name: GRANADA cross-process public/Developer action guard and crash recovery
        run: python -m unittest discover -s tests -p 'test_robot_interlock.py' -v
      - name: Two independent Chrome action workspaces and no concurrent relationship actions
        run: python -m unittest discover -s tests -p 'test_dual_action_workspaces.py' -v
      - name: Two scoped action lease coordinator holds canonical global lock across both workers
        run: python -m unittest discover -s tests -p 'test_dual_action_coordinator.py' -v
      - name: Two real ActionRobot instances with shared global lock and distinct Chrome identity (offline)
        run: python -m unittest discover -s tests -p 'test_dual_action_worker_lease_adapter.py' -v
      - name: Real two-account supervisor offline acceptance and production mode guard
        run: python -m unittest discover -s tests -p 'test_dual_manager_offline_integration.py' -v
      - name: Owner-scoped action lease and legacy-global compatibility
        run: python -m unittest discover -s tests -p 'test_action_scoped_admission.py' -v
      - name: Bound owner-profile visits with final re-verification and cross-account fail-closed tests
        run: python -m unittest discover -s tests -p 'test_action_owner_probe_bound.py' -v
      - name: GRANADA durable write-ahead click intent and no-replay on power loss
        run: python -m unittest discover -s tests -p 'test_action_click_wal.py' -v
      - name: GRANADA owner-supplied Unfollow transport one-shot consent and negative evidence
        run: |
          python -m unittest discover -s tests -p 'test_instagram_unfollow_reference.py' -v
          python -m unittest discover -s tests -p 'test_action_reference_worker_contract.py' -v
          node tests/owner-unfollow-transport.test.cjs
      - name: GRANADA worker admission blocks malformed persisted action evidence
        run: python -m unittest discover -s tests -p 'test_action_worker_journal_gate.py' -v
      - name: GRANADA ten-tab waves with verified-close safety
        run: python -m unittest discover -s tests -p 'test_action_tab_waves.py' -v
      - name: GRANADA verify persisted visit and rest journal integrity
        run: python -m unittest discover -s tests -p 'test_granada_pacing_integrity.py' -v
      - name: GRANADA verify false-success results are retried without modifying original snapshots
        run: python -m unittest discover -s tests -p 'test_granada_false_success_resume.py' -v
      - name: GRANADA preserve duplicate/truncated Profile Counts CSV before resume
        run: python -m unittest discover -s tests -p 'test_granada_csv_recovery.py' -v
      - name: Desktop Insights CSV and account isolation
        run: node tests/profile-counts-ui.test.cjs
      - name: Verify regular Chrome Companion is read-only, scoped and CSV-compatible
        run: node tests/chrome-companion.test.cjs
      - name: Automations planner protected/skip/account isolation
        run: node tests/automations-planner.test.cjs
      - name: Automations Chrome action-control integration
        run: node tests/automations-execution.test.cjs
      - name: Automations interactive anomalies and history
        run: node tests/automations-issues.test.cjs
      - name: Mutuals Focus-only profile ratio priority
        run: node tests/mutual-focus-ratio.test.cjs
