name: Publish IG Cleaner v120.27

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v12027.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android companion
        run: gradle :app:assembleDebug

      - name: Prepare release assets
        working-directory: .
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/IG_Cleaner_Companion_v120.27-debug.apk
          cp desktop/ig_cleaner_pro_v120_27_synced_companion.html release-assets/IG_Cleaner_Pro_v120.27.html
          cp supabase/schema.sql release-assets/IG_Cleaner_v120.27_supabase_schema.sql
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v120.27 >/dev/null 2>&1; then
            echo "Release v120.27 already exists."
            exit 0
          fi
          gh release create v120.27 \
            release-assets/IG_Cleaner_Companion_v120.27-debug.apk \
            release-assets/IG_Cleaner_Pro_v120.27.html \
            release-assets/IG_Cleaner_v120.27_supabase_schema.sql \
            release-assets/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "IG Cleaner Pro v120.27 — Multi-device Sync Beta" \
            --notes "First synchronized Desktop + Android beta.

          - Desktop and Android share reviewed state through Supabase.
          - Focus batches sync as one-by-one Android checklists.
          - Audit preserves whether activity came from Desktop or Android.
          - Email OTP sign-in; users never enter backend URL, keys, or passwords.
          - Supabase Row Level Security isolates each account.
          - Includes Desktop HTML, Android debug APK, Supabase schema, and checksums.

          Desktop OTP login has been validated against the live backend and the Android project passes GitHub Actions compilation."
