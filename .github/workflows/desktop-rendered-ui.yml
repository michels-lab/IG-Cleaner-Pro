name: Desktop rendered UI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'branding/**'
      - 'tests/**'
      - 'tools/create_master_visual_manifest.py'
      - 'tools/visual_release_gate.py'
      - '.github/workflows/desktop-rendered-ui.yml'
      - '.michelslab/release-request.json'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'branding/**'
      - 'tests/**'
      - 'tools/create_master_visual_manifest.py'
      - 'tools/visual_release_gate.py'
      - '.github/workflows/desktop-rendered-ui.yml'
      - '.michelslab/release-request.json'
permissions:
  contents: read
concurrency:
  group: igc-desktop-render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-chromium-render:
    name: Launch distributable HTML; screenshot Home and About
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Build and smoke actual standalone Desktop HTML before capture
        run: |
          python3 tools/build_standalone_desktop_html.py \
            --source desktop/ig_cleaner_pro_v120_27_synced_companion.html \
            --assets-root desktop \
            --output artifacts/desktop-visual/IG-Cleaner-Pro-standalone-tested.html \
            --version "$(python3 -c 'import json; print(json.load(open("release/android-signing.json"))["versionName"])')"
          node tests/desktop-standalone-smoke.cjs artifacts/desktop-visual/IG-Cleaner-Pro-standalone-tested.html
      - name: Verify actual Desktop Chromium file-to-localhost Profile Counts bridge
        run: node tests/profile-counts-browser-e2e.cjs artifacts/desktop-visual/IG-Cleaner-Pro-standalone-tested.html
      - name: Capture real compact and wide Desktop visual tests from built artifact
        env:
          IGC_VISUAL_HTML: artifacts/desktop-visual/IG-Cleaner-Pro-standalone-tested.html
        run: node tests/desktop-visual-smoke.cjs
      - name: Validate master Home/About screenshot evidence
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/create_master_visual_manifest.py \
            --platform desktop \
            --source-manifest artifacts/desktop-visual/manifest.json \
            --artifact artifacts/desktop-visual/IG-Cleaner-Pro-standalone-tested.html \
            --source-sha "$GITHUB_SHA" \
            --out artifacts/desktop-visual/michelslab-manifest.json
          python3 tools/visual_release_gate.py \
            --manifest artifacts/desktop-visual/michelslab-manifest.json \
            --source-sha "$GITHUB_SHA" --platforms desktop --surfaces home,about
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ig-cleaner-real-desktop-ui-${{ github.sha }}
          path: artifacts/desktop-visual/
          retention-days: 30
          if-no-files-found: warn
