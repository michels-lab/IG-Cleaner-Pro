name: IG Cleaner Pro CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'development/**'
    paths:
      - 'desktop/**'
      - 'branding/**'
      - 'android/**'
      - 'tests/**'
      - 'supabase/**'
      - 'release/**'
      - 'docs/UPDATE_AND_STATE_MIGRATION.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-v12034.yml'
      - '.github/workflows/release.yml'
      - '.michelslab/release-request.json'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'desktop/**'
      - 'branding/**'
      - 'android/**'
      - 'tests/**'
      - 'supabase/**'
      - 'release/**'
      - 'docs/UPDATE_AND_STATE_MIGRATION.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-v12034.yml'
      - '.github/workflows/release.yml'
      - '.michelslab/release-request.json'

concurrency:
  group: igc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Desktop local-app contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Desktop HTML and persistent-state contract
        run: node tests/desktop-contract.test.cjs
      - name: Validate sanitized Instagram import fixture
        run: python tests/fixture-contract.py
      - name: Validate official product branding
        run: python tests/branding-contract.py
      - name: Validate privacy and data-handling contract
        run: python tests/privacy-contract.py
      - name: Validate Android UX and Focus regression contract
        run: python tests/android-contract.py
      - name: Validate Android production-signing contract
        run: python tests/android-signing-contract.py
      - name: Validate generic release publisher
        run: python tests/release-publisher-contract.py
      - name: Validate Supabase RLS isolation contract
        run: python tests/rls-contract.py
      - name: Validate distribution manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release/distribution-manifest.json').read_text())
          r=json.loads(Path('.michelslab/release-request.json').read_text())
          assert m['schema']=='ig-cleaner-distribution-v1'
          assert m['releasePolicy']['automaticPublishFromMain'] is False
          assert m['releasePolicy']['explicitManualPublishRequired'] is True
          assert m['releasePolicy']['checksumsRequired'] is True
          assert m['releasePolicy']['currentStableRelease']=='v120.34'
          assert m['releasePolicy']['nextRelease']=='v120.35'
          assert m['releasePolicy']['lastPublishedRun']==37574744462
          assert m['releasePolicy']['genericPublisher']=='.github/workflows/release.yml'
          assert m['releasePolicy']['githubPrerelease'] is False
          assert m['releasePolicy']['stableGithubReleaseIncludesLatestValidatedAndroidApk'] is True
          assert m['channels']['desktop']['artifact']=='IG-Cleaner-Pro-Desktop-v120.34.zip'
          assert m['channels']['desktop']['entrypoint']=='IG-Cleaner-Pro.html'
          assert m['channels']['desktop']['includes']==[
              'assets/michel_duarte_avatar.jpg',
              'assets/michels-lab/official-lockup.png',
          ]
          assert m['channels']['android']['artifact']=='IG-Cleaner-Pro-Android-v120.34.apk'
          assert m['channels']['desktop']['artifactTemplate']=='IG-Cleaner-Pro-Desktop-v{version}.zip'
          assert m['channels']['android']['artifactTemplate']=='IG-Cleaner-Pro-Android-v{version}.apk'
          assert m['channels']['android']['stableArtifactRequiresPersistentSigning'] is True
          assert m['browserState']['indexedDb']=={'name':'ig_cleaner_pro_history','version':1}
          current=m['releasePolicy']['currentStableRelease']
          next_release=m['releasePolicy']['nextRelease']
          assert current=='v120.34'
          assert next_release=='v120.35'
          if r['authorized']:
              assert r['status'] in ('requested','authorized')
              assert r['tag']==next_release
              assert r['version']==next_release.removeprefix('v')
              assert r['requested_channel']=='stable'
              assert r['github_prerelease'] is False
          else:
              assert r['status']=='published'
              assert r['tag']==current
              assert r['version']==current.removeprefix('v')
              assert r['published_run']==37574744462
              assert r['published_commit']
          print('Distribution/state manifest passed: stable v120.34, governed next v120.35.')
          PY

  supabase-rls:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Supabase RLS isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase config
        run: |
          rm -f supabase/config.toml
          supabase init
      - name: Start local Supabase
        run: supabase start
      - name: Apply IG Cleaner sync schema
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Run cross-user RLS tests
        run: supabase test db supabase/tests/rls_isolation.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Android build + embedded Workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build real Android app path
        run: gradle :app:assembleDebug
      - name: Verify exactly one embedded Workspace
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OFFICIAL="assets/ig_cleaner_pro_v120_27_synced_companion.html"
          PORTRAIT="assets/assets/michel_duarte_avatar.jpg"
          LAB_LOCKUP="assets/assets/michels-lab/official-lockup.png"
          LEGACY="assets/ig_cleaner_workspace.html"
          COUNT="$(unzip -l "$APK" | grep -c "$OFFICIAL" || true)"
          test "$COUNT" -eq 1
          SIZE="$(unzip -l "$APK" | awk -v asset="$OFFICIAL" '$0 ~ asset {print $1}')"
          test -n "$SIZE" && test "$SIZE" -gt 700000
          unzip -p "$APK" "$PORTRAIT" > /tmp/igc-portrait.jpg
          unzip -p "$APK" "$LAB_LOCKUP" > /tmp/igc-lab-lockup.png
          cmp /tmp/igc-portrait.jpg ../desktop/assets/michel_duarte_avatar.jpg
          cmp /tmp/igc-lab-lockup.png ../desktop/assets/michels-lab/official-lockup.png
          if unzip -l "$APK" | grep -q "$LEGACY"; then
            echo "::error::Duplicate legacy Workspace asset is packaged: $LEGACY"
            exit 1
          fi
      - name: Smoke-test production signing plumbing with ephemeral CI key
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export IGC_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/igc-ci-release.jks"
          export IGC_ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export IGC_ANDROID_KEY_ALIAS="ig-cleaner-pro-ci"
          export IGC_ANDROID_KEY_PASSWORD="$(openssl rand -hex 24)"

          keytool -genkeypair \
            -keystore "$IGC_ANDROID_KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$IGC_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$IGC_ANDROID_KEY_PASSWORD" \
            -alias "$IGC_ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=IG Cleaner CI, OU=CI, O=Michel's Lab, C=MX"

          gradle :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -f "$APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/igc-release-badging.txt
          EXPECTED_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$EXPECTED_CODE"
          test -n "$EXPECTED_NAME"
          grep -q "package: name='com.michelslab.igcleaner'" /tmp/igc-release-badging.txt
          grep -q "versionCode='$EXPECTED_CODE'" /tmp/igc-release-badging.txt
          grep -q "versionName='$EXPECTED_NAME'" /tmp/igc-release-badging.txt
          if grep -q "com.michelslab.igcleaner.beta" /tmp/igc-release-badging.txt; then
            echo "::error::Release signing smoke test produced beta application id."
            exit 1
          fi
