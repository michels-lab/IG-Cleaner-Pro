name: Publish governed stable release

on:
  push:
    branches: ["main"]
    paths:
      - ".michelslab/release-request.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  deployments: read

jobs:
  release-request-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Ignore already-published release requests
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          with open(".michelslab/release-request.json", encoding="utf-8") as f:
              request = json.load(f)
          enabled = request.get("authorized") is True and request.get("status") in ("requested", "authorized")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("publish=" + ("true" if enabled else "false") + "\n")
          print("Release authorization active:", enabled)
          PY

  rendered-ui-qa:
    needs: release-request-gate
    if: needs.release-request-gate.outputs.publish == 'true'
    # User reviews the finished release. Required automated UI capture remains fail-closed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact-commit installed Android About screenshot proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 45); do
            RUN_ID="$(gh run list --workflow android-about-visual.yml --commit "$GITHUB_SHA" --limit 30 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success") | .databaseId] | first // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          test -n "$RUN_ID" || { echo "::error::No successful exact-commit Android UI render run"; exit 1; }
          mkdir -p visual-evidence
          gh run download "$RUN_ID" --name "ig-cleaner-real-android-about-${GITHUB_SHA}" --dir visual-evidence
      - name: Verify real About screenshots match candidate commit and APK
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 -m unittest discover -s tests -p 'test_android_release_visual_evidence.py' -v
          python3 tools/verify_android_visual_release_evidence.py --artifact visual-evidence --sha "$GITHUB_SHA"
          python3 tools/visual_release_gate.py \
            --manifest visual-evidence/michelslab-manifest.json \
            --source-sha "$GITHUB_SHA" --platforms android --surfaces home,about
          echo "Android Home+About rendered evidence verified on installed debug APK; signed release APK and physical phone remain separate evidence levels."
      - name: Download exact-commit Desktop Home/About Chromium screenshot proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 45); do
            RUN_ID="$(gh run list --workflow desktop-rendered-ui.yml --commit "$GITHUB_SHA" --limit 50 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success") | .databaseId] | first // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          test -n "$RUN_ID" || { echo "::error::No successful exact-commit Desktop browser visual run"; exit 1; }
          mkdir -p desktop-visual-evidence
          gh run download "$RUN_ID" --name "ig-cleaner-real-desktop-ui-${GITHUB_SHA}" --dir desktop-visual-evidence
      - name: Rebuild exact standalone HTML and verify runtime Desktop Home/About
        run: |
          set -euo pipefail
          # Multi-directory upload-artifact can preserve desktop-visual/ instead
          # of flattening it. Select exactly ONE real two-manifest evidence root.
          # Never fabricate, copy or ignore missing screenshots.
          EVIDENCE_DIR="$(python3 tools/resolve_desktop_visual_artifact_dir.py --artifact desktop-visual-evidence)"
          echo "Validating downloaded exact-commit Desktop screenshots at $EVIDENCE_DIR"
          python3 tools/build_standalone_desktop_html.py \
            --source desktop/ig_cleaner_pro_v120_27_synced_companion.html \
            --assets-root desktop \
            --output "$EVIDENCE_DIR/IG-Cleaner-Pro-standalone-rebuilt.html" \
            --version "$(python3 -c 'import json; print(json.load(open("release/android-signing.json"))["versionName"])')"
          python3 tools/verify_desktop_visual_release_evidence.py \
            --artifact "$EVIDENCE_DIR" \
            --html "$EVIDENCE_DIR/IG-Cleaner-Pro-standalone-rebuilt.html" \
            --sha "$GITHUB_SHA"
          python3 tools/visual_release_gate.py \
            --manifest "$EVIDENCE_DIR/michelslab-manifest.json" \
            --source-sha "$GITHUB_SHA" --platforms desktop --surfaces home,about

  android-developer-qa:
    # Product's separate Developer APK is a required FINAL stable artifact.
    # It must actually launch and complete account/annotations/export checks
    # on a real emulator, not merely compile with a disposable CI signer.
    needs: release-request-gate
    if: needs.release-request-gate.outputs.publish == 'true'
    name: Install Android Developer APK; account, notes, JSON acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate separately governed Developer package and signing contract
        run: python3 tests/developer-release-contract.py
      - name: Enable emulator KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install BOTH public and Developer APKs, click real Account and export real note
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash tools/run_android_developer_ui.sh
      - name: Preserve privacy-safe native Developer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-final-stable-developer-android-${{ github.sha }}
          path: artifacts/android-developer/
          retention-days: 30
          if-no-files-found: warn

  windows-robot:
    needs: release-request-gate
    if: needs.release-request-gate.outputs.publish == 'true'
    name: Insta Cleaner Pro integrated Windows Setup and installed startup
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Install build-time dependencies only
        shell: pwsh
        run: |
          python -m pip install playwright==1.57.0 pyinstaller==6.16.0
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          python tests/windows-installer-contract.py
          if ($LASTEXITCODE -ne 0) { throw "Setup contract failed." }
      - name: Verify bounded installer process guard (success, failure, hang)
        shell: pwsh
        run: |
          ./tests/test_installer_process_guard.ps1
      - name: Verify Pending import, focus, third-batch and no-click replay protections
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_action_click_wal.py' -v
          python -m unittest discover -s tests -p 'test_action_owner_probe_bound.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Bounded owner profile navigation regression failed; refuse FINAL release.' }
          python -m unittest discover -s tests -p 'test_action_owner_proof_reuse.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Owner session-bound proof reuse/changed-session tests failed; refuse FINAL release.' }
          python -m unittest discover -s tests -p 'test_action_tab_flow.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Target navigation A-to-B-to-A backtrack regression; refuse FINAL release.' }
          python -m unittest discover -s tests -p 'test_action_visit_pacing.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent hourly/batch/personal visit pacing tests failed; refuse FINAL release.' }
          python -m unittest discover -s tests -p 'test_action_worker_journal_gate.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Possible Instagram click could replay after shutdown; refuse publication.' }
          python -m unittest discover -s tests -p 'test_profile_counts_actions.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Exact Instagram target identity and action safety regressions failed; refuse publication.' }
          python -m unittest discover -s tests -p 'test_robot_interlock.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Cross-process owner action lock failed; refuse publication.' }
          node tests/automations-next-batch.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Automations action batch selection failed." }
          node tests/automations-cold-start.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Cold-start Windows action history verification failed." }
          node tests/pending-focus-reimport.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Stale Focus import refresh failed." }
          python -m unittest discover -s tests -p 'test_action_batch_history.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Persisted prior-batch exclusions failed." }
      - name: Offline owner-reference Unfollow, durable WAL and real Chromium acceptance
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_instagram_unfollow_reference.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Owner reference Unfollow and no-replay tests failed; refuse FINAL release." }
          python -m unittest discover -s tests -p 'test_instagram_unfollow_chromium_e2e.py' -v
          if ($LASTEXITCODE -ne 0) { throw "One-POST exact-target real Chromium Unfollow regression failed; refuse FINAL release." }
          node tests/owner-unfollow-transport.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Supplied-JavaScript Unfollow transport contract failed; refuse FINAL release." }
      - name: Offline public/private Instagram action flows in real Chromium
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_actions_chromium.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Chromium Instagram actions flow tests failed." }
      - name: Validate durable oldest-first re-audit and dated Windows history
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_counts_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Windows re-audit history tests failed." }
      - name: Test verified GitHub Windows updater and opt-in install UX (offline)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_windows_updater.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native Windows updater security tests failed." }
          node tests/windows-updater-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows Update dialog acceptance tests failed." }
      - name: Validate integrated app launch and persistence contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_native_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Integrated desktop tests failed." }
      - name: Create self-contained Desktop app HTML
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts\profile-counts-preview" | Out-Null
          python tools/build_standalone_desktop_html.py --source desktop/ig_cleaner_pro_v120_27_synced_companion.html --assets-root desktop --output artifacts/profile-counts-preview/IG-Cleaner-Pro.html --version ((Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName)
          if ($LASTEXITCODE -ne 0) { throw "The Desktop HTML failed to build." }
          node tests/desktop-standalone-smoke.cjs "artifacts/profile-counts-preview/IG-Cleaner-Pro.html"
          if ($LASTEXITCODE -ne 0) { throw "The packaged Desktop HTML failed its smoke test." }
          node tests/profile-counts-indexeddb-browser.cjs "artifacts/profile-counts-preview/IG-Cleaner-Pro.html"
          if ($LASTEXITCODE -ne 0) { throw "IndexedDB migration and 250k-profile browser checks failed." }
      - name: Build Windows executable with embedded Playwright driver
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --collect-all playwright --icon desktop/assets/ig-cleaner-pro/official-app-icon.ico --add-data "artifacts/profile-counts-preview/IG-Cleaner-Pro.html;ui" --add-data "release/android-signing.json;metadata" --name InstaCleanerPro tools/ig_cleaner_desktop.py
      - name: Test the frozen executable without contacting Instagram
        shell: pwsh
        run: |
          # A --windowed PyInstaller application is a GUI process; calling it
          # with & does not reliably wait or refresh PowerShell's LASTEXITCODE.
          $candidate = (Resolve-Path ".\dist\InstaCleanerPro.exe").Path
          . ./tools/installer_process_guard.ps1
          Invoke-IgcBoundedProcess -Path $candidate -Arguments @("--healthcheck") -Label "Frozen PyInstaller healthcheck" -TimeoutSeconds 100
      - name: Bundle integrated one-click application and instructions
        shell: pwsh
        run: |
          Copy-Item dist/InstaCleanerPro.exe artifacts/profile-counts-preview/
          Copy-Item packaging/profile-counts/README.txt artifacts/profile-counts-preview/
          Copy-Item packaging/chrome-extension artifacts/profile-counts-preview/chrome-extension -Recurse -Force
          node tests/chrome-companion.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Chrome Companion contract failed." }
          @(
            "candidate_source_sha=${{ github.sha }}"
            "candidate_kind=stable_github_release_live_instagram_untested"
            "application=Insta Cleaner Pro / Windows App + Automations + Profile Counts"
          ) | Set-Content artifacts/profile-counts-preview/BUILD-INFO.txt
          Get-FileHash artifacts/profile-counts-preview/InstaCleanerPro.exe -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash | Set-Content artifacts/profile-counts-preview/EXECUTABLE-SHA256.txt
          if (!(Test-Path artifacts/profile-counts-preview/IG-Cleaner-Pro.html)) { throw "HTML absent." }
          if (!(Test-Path artifacts/profile-counts-preview/InstaCleanerPro.exe)) { throw "Integrated Windows app absent." }
          if (!(Test-Path artifacts/profile-counts-preview/chrome-extension/manifest.json)) { throw "Chrome extension manifest absent." }
          if (Test-Path artifacts/profile-counts-preview/Start-Insta-Cleaner-Robot.cmd) { throw "Legacy .cmd launcher must not ship." }
          # The HTML is embedded inside the EXE, not an additional file the user must open.
          Remove-Item artifacts/profile-counts-preview/IG-Cleaner-Pro.html -Force
          if (Test-Path artifacts/profile-counts-preview/IG-Cleaner-Pro.html) { throw "HTML must not ship separately." }
          $version = (Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName
          Compress-Archive -Path artifacts/profile-counts-preview/* -DestinationPath "artifacts/IG-Cleaner-Pro-Automatic-Robot-Windows-v$version.zip" -Force
      - name: Compile governed Windows Setup, install/launch/uninstall
        shell: pwsh
        run: |
          $version = (Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName
          ./tools/build_windows_installer.ps1 -PayloadDir artifacts/profile-counts-preview -Version $version
          ./tools/test_windows_installer_wizard.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Setup-v$version.exe" -Screenshot artifacts/IG-Cleaner-Pro-Installer-EULA.png
          ./tools/test_windows_installer.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Setup-v$version.exe" -Version $version
      - name: Build, install, launch and uninstall independent Developer Windows Setup
        shell: pwsh
        run: |
          $version = (Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName
          python -m unittest discover -s tests -p 'test_developer_audit.py' -v
          python -m unittest discover -s tests -p 'test_developer_live_probe.py' -v
          node tests/developer-annotations-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Developer consent/chat tests failed." }
          ./tools/build_windows_developer_installer.ps1 -PayloadDir artifacts/profile-counts-preview -Version $version
          ./tools/test_windows_developer_installer.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v$version.exe" -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Independent Developer Windows install test failed." }
      - name: Retain Windows installer diagnostics even on failed QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-installer-diagnostics-${{ github.sha }}
          path: |
            artifacts/IG-Cleaner-Pro-Installer-InstallLog.txt
            artifacts/IG-Cleaner-Pro-Developer-Installer-InstallLog.txt
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-installer-wizard-evidence-${{ github.sha }}
          path: artifacts/IG-Cleaner-Pro-Installer-EULA.png
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cleaner-stable-windows-robot-${{ github.sha }}
          path: |
            artifacts/IG-Cleaner-Pro-Automatic-Robot-Windows-v*.zip
            artifacts/IG-Cleaner-Pro-Windows-Setup-v*.exe
            artifacts/IG-Cleaner-Pro-Windows-Setup-v*.exe.sha256
            artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v*.exe
            artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v*.exe.sha256
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [release-request-gate, rendered-ui-qa, windows-robot, android-developer-qa]
    if: needs.release-request-gate.outputs.publish == 'true' && needs.rendered-ui-qa.result == 'success' && needs.windows-robot.result == 'success' && needs.android-developer-qa.result == 'success'
    runs-on: ubuntu-latest
    env:
      IGC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IGC_ANDROID_KEYSTORE_PASSWORD }}
      IGC_ANDROID_KEY_ALIAS: ${{ secrets.IGC_ANDROID_KEY_ALIAS }}
      IGC_ANDROID_KEY_PASSWORD: ${{ secrets.IGC_ANDROID_KEY_PASSWORD }}
      IGC_ANDROID_SIGNED_DEVELOPER_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve and verify release request
        id: release
        run: |
          python3 - <<'PY'
          import json, pathlib, re, os
          manifest=json.loads(pathlib.Path("release/distribution-manifest.json").read_text())
          request=json.loads(pathlib.Path(".michelslab/release-request.json").read_text())
          signing=json.loads(pathlib.Path("release/android-signing.json").read_text())
          policy=manifest["releasePolicy"]

          version=str(request.get("version","")).strip()
          tag=str(request.get("tag","")).strip()
          assert re.fullmatch(r"\d+\.\d+", version), "Release version must look like 120.35"
          assert tag == f"v{version}", "Release tag must exactly match version"
          assert request.get("authorized") is True, "Release request is not explicitly authorized"
          assert request.get("status") in ("requested","authorized"), "Release request is not in a publishable state"
          assert request.get("requested_channel") == "stable"
          assert request.get("github_prerelease") is False
          assert policy["nextRelease"] == tag
          assert policy["githubPrerelease"] is False
          assert policy["explicitManualPublishRequired"] is True
          assert policy["stableGithubReleaseIncludesLatestValidatedAndroidApk"] is True
          assert policy["requireDeveloperTwinAssets"] is True
          assert policy["requireDeveloperAndroidProductionSigning"] is True
          assert policy["requireDeveloperWindowsIndependentInstallTest"] is True
          assert manifest["channels"]["androidDeveloper"]["packageId"] == "com.michelslab.igcleaner.developer"
          assert manifest["channels"]["androidDeveloper"]["signRequired"] is True
          assert signing["packageId"] == "com.michelslab.igcleaner"

          desktop=manifest["channels"]["desktop"]["artifactTemplate"].replace("{version}",version)
          android=manifest["channels"]["android"]["artifactTemplate"].replace("{version}",version)
          desktop_html=manifest["channels"]["desktop"]["primaryArtifactTemplate"].replace("{version}",version)
          android_dev=manifest["channels"]["androidDeveloper"]["artifactTemplate"].replace("{version}",version)
          windows_dev=manifest["channels"]["windowsDeveloper"]["artifactTemplate"].replace("{version}",version)
          assert android_dev == f"IG-Cleaner-Pro-Android-Developer-v{version}.apk"
          assert windows_dev == f"IG-Cleaner-Pro-Windows-Developer-Setup-v{version}.exe"
          assert desktop_html == f"IG-Cleaner-Pro-Desktop-v{version}.html"
          assert manifest["channels"]["desktop"]["standaloneOffline"] is True
          expected_code=int(version.replace(".",""))
          assert signing["versionName"] == version, "Signing metadata versionName does not match release request"
          assert signing["versionCode"] == expected_code, "Signing metadata versionCode does not match release request"

          gradle=pathlib.Path("android/app/build.gradle.kts").read_text()
          assert f'versionName = "{version}"' in gradle
          assert f"versionCode = {expected_code}" in gradle
          assert 'applicationIdSuffix = ".beta"' in gradle
          assert 'applicationIdSuffix = ".developer"' in gradle
          assert 'developerPublicationRequested' in gradle
          assert "Production Android signing is required" in gradle

          html=pathlib.Path("desktop/ig_cleaner_pro_v120_27_synced_companion.html").read_text(encoding="utf-8")
          assert f"UI v{version}" in html
          assert "normalizeLegacyReviewState" in html
          assert "pushWorkspaceState" in html
          assert "list_snapshots" in html
          assert 'src="assets/michel_duarte_avatar.jpg"' in html
          assert 'src="assets/michels-lab/official-lockup.png"' in html

          out=os.environ["GITHUB_OUTPUT"]
          with open(out,"a",encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
              f.write(f"version_code={expected_code}\n")
              f.write(f"desktop_artifact={desktop}\n")
              f.write(f"desktop_html_artifact={desktop_html}\n")
              f.write(f"android_artifact={android}\n")
              f.write(f"android_developer_artifact={android_dev}\n")
              f.write(f"windows_developer_artifact={windows_dev}\n")
          PY

      - name: Run release contracts
        run: |
          node tests/desktop-contract.test.cjs
          python3 tests/fixture-contract.py
          python3 tests/branding-contract.py
          python3 tests/privacy-contract.py
          python3 tests/android-contract.py
          python3 tests/android-native-english-contract.py
          python3 tests/english-ui-contract.py
          python3 tests/windows-automations-owner-contract.py
          node tests/chrome-companion.test.cjs
          python3 tests/android-signing-contract.py
          python3 tests/release-publisher-contract.py
          python3 tests/developer-release-contract.py
          python3 tests/standalone-desktop-contract.py
          python3 tests/rls-contract.py

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore production Android keystore
        env:
          IGC_ANDROID_KEYSTORE_B64: ${{ secrets.IGC_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$IGC_ANDROID_KEYSTORE_B64"
          test -n "$IGC_ANDROID_KEYSTORE_PASSWORD"
          test -n "$IGC_ANDROID_KEY_ALIAS"
          test -n "$IGC_ANDROID_KEY_PASSWORD"
          IGC_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ig-cleaner-pro-release.jks"
          echo "$IGC_ANDROID_KEYSTORE_B64" | base64 --decode > "$IGC_ANDROID_KEYSTORE_PATH"
          chmod 600 "$IGC_ANDROID_KEYSTORE_PATH"
          echo "IGC_ANDROID_KEYSTORE_PATH=$IGC_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify production signing identity
        run: |
          EXPECTED="$(python3 -c 'import json; print(json.load(open("release/android-signing.json"))["certificateSha256"])')"
          ACTUAL="$(keytool -list -v -keystore "$IGC_ANDROID_KEYSTORE_PATH" -storepass "$IGC_ANDROID_KEYSTORE_PASSWORD" -alias "$IGC_ANDROID_KEY_ALIAS" | awk -F'SHA256: ' '/SHA256:/{gsub(/:/,"",$2); print $2; exit}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build both production-signed Android public and Developer APKs
        run: gradle -p android :app:assembleRelease :app:assembleDeveloper

      - name: Verify signed Android package
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt

          grep -q "package: name='com.michelslab.igcleaner'" /tmp/badging.txt
          grep -q "versionCode='${{ steps.release.outputs.version_code }}'" /tmp/badging.txt
          grep -q "versionName='${{ steps.release.outputs.version }}'" /tmp/badging.txt
          ! grep -q "com.michelslab.igcleaner.beta" /tmp/badging.txt

          EXPECTED="$(python3 -c 'import json; print(json.load(open("release/android-signing.json"))["certificateSha256"].lower())')"
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' /tmp/apksigner.txt | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"

          # Developer must be signed by the SAME persistent identity while
          # retaining a separate package, application data and displayed name.
          DEV_APK="android/app/build/outputs/apk/developer/app-developer.apk"
          test -s "$DEV_APK"
          "$APKSIGNER" verify --verbose --print-certs "$DEV_APK" | tee /tmp/dev-apksigner.txt
          "$AAPT" dump badging "$DEV_APK" | tee /tmp/dev-badging.txt
          grep -q "package: name='com.michelslab.igcleaner.developer'" /tmp/dev-badging.txt
          grep -q "versionCode='${{ steps.release.outputs.version_code }}'" /tmp/dev-badging.txt
          grep -q "versionName='${{ steps.release.outputs.version }}-developer'" /tmp/dev-badging.txt
          DEV_CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' /tmp/dev-apksigner.txt | tr '[:upper:]' '[:lower:]')"
          test "$DEV_CERT" = "$ACTUAL"
          # aapt package IDs are authoritative: separate app, separate storage.
          ! grep -q "package: name='com.michelslab.igcleaner'" /tmp/dev-badging.txt
          ! grep -q "package: name='com.michelslab.igcleaner.developer'" /tmp/badging.txt
          unzip -p "$DEV_APK" assets/ig_cleaner_pro_v120_27_synced_companion.html > /tmp/igc-developer-release-embedded.html
          grep -q 'igcDevSaveNote' /tmp/igc-developer-release-embedded.html

      - name: Reject unproven signed Android launch (offline adversarial fixture)
        run: |
          python3 tests/release-publisher-contract.py
          python3 -m unittest discover -s tests -p 'test_android_signed_coinstall_runtime.py' -v

      - name: Enable Android emulator hardware acceleration for signed coexistence
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'KVM device enabled for real signed Android installation and foreground proof.'
          else
            echo '::warning::No /dev/kvm on runner; continuing with slower real emulator and all unchanged fail-closed checks.'
          fi

      - name: Prove both production-signed Android packages install side by side
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The emulator action runs this under /bin/sh. Do not put bash-only
          # pipefail directly in YAML's script block: dash rejects it before
          # either signed APK can be installed and tested.
          script: bash tools/verify_production_android_coinstall.sh
      - name: Build release bundle
        run: |
          rm -rf dist package
          mkdir -p package/assets/michels-lab package/assets/ig-cleaner-pro dist
          cp desktop/ig_cleaner_pro_v120_27_synced_companion.html package/IG-Cleaner-Pro.html
          cp desktop/assets/michel_duarte_avatar.jpg package/assets/michel_duarte_avatar.jpg
          cp desktop/assets/michels-lab/official-lockup.png package/assets/michels-lab/official-lockup.png
          cp desktop/assets/ig-cleaner-pro/official-app-icon.png package/assets/ig-cleaner-pro/official-app-icon.png
          cp branding/ig-cleaner-pro/official-app-icon-1024.png "dist/Instagram-Cleaner-Pro-v${{ steps.release.outputs.version }}-logo.png"
          cp docs/PRIVACY.md "dist/Instagram-Cleaner-Pro-v${{ steps.release.outputs.version }}-PRIVACY.md"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ steps.release.outputs.android_artifact }}"
          cp android/app/build/outputs/apk/developer/app-developer.apk "dist/${{ steps.release.outputs.android_developer_artifact }}"
          (cd package && zip -r "../dist/${{ steps.release.outputs.desktop_artifact }}" .)
          python3 tools/build_standalone_desktop_html.py \
            --source package/IG-Cleaner-Pro.html \
            --assets-root package \
            --output "dist/${{ steps.release.outputs.desktop_html_artifact }}" \
            --version "${{ steps.release.outputs.version }}"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Download validated Windows robot from same commit
        uses: actions/download-artifact@v4
        with:
          name: ig-cleaner-stable-windows-robot-${{ github.sha }}
          path: dist
      - name: Verify Windows installer and portable ZIP, then refresh SHA256 checksums
        run: |
          set -euo pipefail
          ROBOT_ZIP="dist/IG-Cleaner-Pro-Automatic-Robot-Windows-v${{ steps.release.outputs.version }}.zip"
          find dist -type f -name "*Automatic-Robot*" -print
          if [ ! -f "$ROBOT_ZIP" ]; then
            mapfile -t candidates < <(find dist -type f -name "*Automatic-Robot-Windows-v*.zip")
            test "${#candidates[@]}" -eq 1 || { echo "::error::Expected one Windows robot artifact; got ${#candidates[@]}"; exit 1; }
            mv "${candidates[0]}" "$ROBOT_ZIP"
          fi
          test -s "$ROBOT_ZIP"
          SETUP="dist/IG-Cleaner-Pro-Windows-Setup-v${{ steps.release.outputs.version }}.exe"
          test -s "$SETUP"
          test "$(stat -c%s "$SETUP")" -gt 10000000
          test -s "$SETUP.sha256"
          DEV_SETUP="dist/${{ steps.release.outputs.windows_developer_artifact }}"
          test -s "$DEV_SETUP"
          test "$(stat -c%s "$DEV_SETUP")" -gt 10000000
          test -s "$DEV_SETUP.sha256"
          echo "Verified same-commit Windows Setup: $SETUP and Developer Setup: $DEV_SETUP"
          python3 - "$ROBOT_ZIP" "${{ steps.release.outputs.version }}" <<'PY'
          import sys, zipfile
          path, version = sys.argv[1:]
          required = {"InstaCleanerPro.exe", "BUILD-INFO.txt", "EXECUTABLE-SHA256.txt", "README.txt",
                        "chrome-extension/manifest.json", "chrome-extension/popup.html",
                        "chrome-extension/popup.js", "chrome-extension/collector.js",
                        "chrome-extension/README.md"}
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              assert required <= names, f"Missing integrated Windows files: {required-names}"
              assert "Start-Insta-Cleaner-Robot.cmd" not in names, "Legacy launcher must not ship"
              assert "IG-Cleaner-Pro.html" not in names, "Embedded UI must not ship as external HTML"
              build = archive.read("BUILD-INFO.txt").decode("utf-8")
              assert "stable_github_release_live_instagram_untested" in build
              assert archive.getinfo("InstaCleanerPro.exe").file_size > 10_000_000
          print(f"Verified integrated Windows EXE ZIP v{version}: {path}")
          PY
          # Check per-installer SHA-256 digests before publishing.
          python3 - "$SETUP" "$DEV_SETUP" <<'PY'
          import hashlib, pathlib, sys
          for name in sys.argv[1:]:
              p=pathlib.Path(name)
              digest=hashlib.sha256(p.read_bytes()).hexdigest().lower()
              expected=p.with_name(p.name+".sha256").read_text().strip().split()[0].lower()
              assert digest == expected, f"Installer checksum mismatch: {p.name}"
          PY
          (cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt)
      - name: Verify release bundle contents
        run: |
          unzip -l "dist/${{ steps.release.outputs.desktop_artifact }}" | grep "IG-Cleaner-Pro.html"
          unzip -l "dist/${{ steps.release.outputs.desktop_artifact }}" | grep "assets/michel_duarte_avatar.jpg"
          unzip -l "dist/${{ steps.release.outputs.desktop_artifact }}" | grep "assets/michels-lab/official-lockup.png"
          unzip -l "dist/${{ steps.release.outputs.desktop_artifact }}" | grep "assets/ig-cleaner-pro/official-app-icon.png"
          test -f "dist/${{ steps.release.outputs.desktop_html_artifact }}"
          test "$(grep -o 'data:image/' "dist/${{ steps.release.outputs.desktop_html_artifact }}" | wc -l)" -ge 3
          test -f "dist/${{ steps.release.outputs.android_artifact }}"
          test -s "dist/${{ steps.release.outputs.android_developer_artifact }}"
          test -s "dist/${{ steps.release.outputs.windows_developer_artifact }}"
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Build release notes
        run: |
          cat > release-notes.md <<'EOF'
          # Instagram Cleaner Pro v${{ steps.release.outputs.version }}

          Normal GitHub release (**not a prerelease**).

          ## Desktop
          **Recommended direct download:** **${{ steps.release.outputs.desktop_html_artifact }}** — one standalone HTML file with product, author, and Michel's Lab images embedded; open directly in your browser, no extraction required.

          **Optional full bundle:** **${{ steps.release.outputs.desktop_artifact }}**, containing HTML and the separate original assets/ folder.

          ## Windows integrated app + automation
          **Recommended Windows installer:** download `IG-Cleaner-Pro-Windows-Setup-v${{ steps.release.outputs.version }}.exe`. Run Setup, accept the complete license, select any optional shortcut, and launch **Insta Cleaner Pro** from Start. It installs the complete robot, a read-only Chrome Companion folder, taskbar pinning instructions, and a Windows uninstaller. Later versions upgrade in place without deleting local imported lists, browser workspaces, or robot history. Chrome is still required.

          **Developer Edition — independent Windows installation:** ${{ steps.release.outputs.windows_developer_artifact }}. Installs next to the public app, not on top of it. Its basic local diagnostic chat, section notes and report copy are local. It can modify real Instagram relationships ONLY in the separate owner-authorized, exact-target 1–10 Unfollow/Cancel test; never from free-text chat. Tests are not proof of success in the owner's live Instagram.

          **Optional legacy portable archive:** `IG-Cleaner-Pro-Automatic-Robot-Windows-v${{ steps.release.outputs.version }}.zip` remains available for compatibility, but Setup is the normal Windows download. Robots still require explicit batch approval and Instagram identity verification; Mutuals is Focus-only.

          **Acceptance limitation:** automated browser flows passed offline Chromium UI simulations; live Instagram signed-in DOM, action clicks on the owner's account, and real Windows/Android account data were not validated. Instagram can block browsing or change controls. Stop on challenge/account mismatch, back up data, and test with a small deliberately selected batch. Android cannot run the Windows robot or automatically synchronize new Profile Counts results.
          ## Android
          Use **${{ steps.release.outputs.android_artifact }}**. It is the stable package **com.michelslab.igcleaner**, signed with the persistent IG Cleaner Pro production identity.

          **Android Developer Edition:** ${{ steps.release.outputs.android_developer_artifact }} installs next to the stable Android app as `com.michelslab.igcleaner.developer`. It uses the SAME production signing certificate, but has independent local data. Android Developer diagnostics are read-only; the Windows-only live action tester is not available on Android.

          SHA-256 checksums are included in **SHA256SUMS.txt**.
          EOF
          if [ -f release/RELEASE_NOTES.md ]; then
            printf "\n## Changes\n\n" >> release-notes.md
            cat release/RELEASE_NOTES.md >> release-notes.md
          fi

      - name: Publish normal GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          TITLE="Instagram Cleaner Pro v${{ steps.release.outputs.version }}"
          # Published FINAL artifacts are immutable from our publisher.
          # Re-run/dispatch with a stale authorized request must never edit or
          # overwrite an already-published stable release or its checksum set.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::FINAL release $TAG already exists. Refusing to edit or overwrite published assets."
            exit 1
          fi
          # If the existence check fails due to a provider/network error, the
          # create-only API still rejects an existing tag instead of clobbering it.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/$TAG --jq .prerelease)" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/$TAG --jq .draft)" = "false"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ steps.release.outputs.android_artifact }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ steps.release.outputs.desktop_artifact }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ steps.release.outputs.desktop_html_artifact }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "IG-Cleaner-Pro-Automatic-Robot-Windows-v${{ steps.release.outputs.version }}.zip"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "IG-Cleaner-Pro-Windows-Setup-v${{ steps.release.outputs.version }}.exe"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ steps.release.outputs.android_developer_artifact }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ steps.release.outputs.windows_developer_artifact }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "SHA256SUMS.txt"
          gh release view "$TAG" --json tagName,isPrerelease,isDraft,url
