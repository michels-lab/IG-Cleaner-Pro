permissions:
  contents: read

jobs:
  windows-portable:
    name: Insta Cleaner Pro integrated Windows installer
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium
      - name: Install build-time dependencies only
        shell: pwsh
        run: |
          python -m pip install playwright==1.57.0 pyinstaller==6.16.0
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup dependency install failed." }
          python tests/windows-installer-contract.py
          if ($LASTEXITCODE -ne 0) { throw "Installer/brand/EULA contract failed." }
      - name: Verify Pending import, focus, third-batch and no-click replay protections
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_action_click_wal.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Durable before-click journal fail-closed tests failed.' }
          python -m unittest discover -s tests -p 'test_instagram_unfollow_reference.py' -v
          python -m unittest discover -s tests -p 'test_instagram_unfollow_chromium_e2e.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Chromium user-reference actual worker offline integration failed.' }
          if ($LASTEXITCODE -ne 0) { throw 'User supplied single-POST Unfollow and no-replay contract failed.' }
          node tests/owner-unfollow-transport.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'User reference JavaScript browser-context action contract failed.' }
          python -m unittest discover -s tests -p 'test_action_worker_journal_gate.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Durable before-click journal fail-closed tests failed.' }
          python -m unittest discover -s tests -p 'test_profile_counts_actions.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Exact Instagram target identity and action safety regressions failed; refuse publication.' }
          python -m unittest discover -s tests -p 'test_robot_interlock.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Public/Developer cross-process action interlock failed.' }
          node tests/automations-next-batch.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Automations next batch failed." }
          node tests/developer-annotations-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Developer Edition section note/export contract failed." }
          python -m unittest discover -s tests -p 'test_developer_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Developer local audit privacy contract failed." }
          python -m unittest discover -s tests -p 'test_developer_live_probe.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Developer real Instagram read-only/consent gate tests failed." }
          node tests/pending-focus-reimport.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Stale Focus import refresh failed." }
          python -m unittest discover -s tests -p 'test_action_tab_waves.py' -v
          if ($LASTEXITCODE -ne 0) { throw "GRANADA full-wave robot regression failed." }
          python -m unittest discover -s tests -p 'test_historical_recheck.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Historical no-click re-audit safety contract failed." }
          python -m unittest discover -s tests -p 'test_action_batch_history.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Persisted prior-batch exclusions failed." }
      - name: Verify owner-approved live list pagination cannot mutate Instagram
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_lists_live.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Optional live friendship list contract failed.' }
      - name: Bounded owner-navigation and wrong-session regression (offline)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_action_owner_probe_bound.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Owner navigation verification regression; refuse Windows Setup.' }
      - name: Offline public/private Instagram action flows in real Chromium
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_actions_chromium.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Chromium Instagram actions flow tests failed." }
      - name: Reject Instagram reCAPTCHA login loops without navigation or bypass
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_counts_recaptcha.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Instagram CAPTCHA safety regression failed." }
      - name: Validate durable oldest-first re-audit and dated Windows history
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_profile_counts_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Windows re-audit history tests failed." }
          python -m unittest discover -s tests -p 'test_granada_pacing_integrity.py' -v
          if ($LASTEXITCODE -ne 0) { throw "GRANADA Profile Counts pacing ledger tests failed." }
          python -m unittest discover -s tests -p 'test_granada_false_success_resume.py' -v
          if ($LASTEXITCODE -ne 0) { throw "GRANADA false-success resume tests failed." }
          python -m unittest discover -s tests -p 'test_granada_csv_recovery.py' -v
          if ($LASTEXITCODE -ne 0) { throw "GRANADA corrupt CSV fail-closed tests failed." }
      - name: Test verified GitHub Windows updater and opt-in install UX (offline)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_windows_updater.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Native Windows updater security tests failed." }
          node tests/windows-updater-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows Update dialog acceptance tests failed." }
      - name: Validate integrated app launch and persistence contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_native_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Integrated desktop tests failed." }
      - name: Create self-contained Desktop app HTML
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts\profile-counts-preview" | Out-Null
          python tools/build_standalone_desktop_html.py --source desktop/ig_cleaner_pro_v120_27_synced_companion.html --assets-root desktop --output artifacts/profile-counts-preview/IG-Cleaner-Pro.html --version ((Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName)
          if ($LASTEXITCODE -ne 0) { throw "The Desktop HTML failed to build." }
          node tests/desktop-standalone-smoke.cjs "artifacts/profile-counts-preview/IG-Cleaner-Pro.html"
          if ($LASTEXITCODE -ne 0) { throw "The packaged Desktop HTML failed its smoke test." }
          node tests/profile-counts-indexeddb-browser.cjs "artifacts/profile-counts-preview/IG-Cleaner-Pro.html"
          if ($LASTEXITCODE -ne 0) { throw "IndexedDB migration and 250k-profile browser acceptance failed." }
          node tests/automation-center-browser.test.cjs "artifacts/profile-counts-preview/IG-Cleaner-Pro.html"
          if ($LASTEXITCODE -ne 0) { throw "Rendered Windows Analysis/Action command center acceptance failed." }
      - name: Build Windows executable with embedded Playwright driver
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --collect-all playwright --icon desktop/assets/ig-cleaner-pro/official-app-icon.ico --add-data "artifacts/profile-counts-preview/IG-Cleaner-Pro.html;ui" --add-data "release/android-signing.json;metadata" --name InstaCleanerPro tools/ig_cleaner_desktop.py
      - name: Test the frozen executable without contacting Instagram
        shell: pwsh
        run: |
          # A --windowed PyInstaller application is a GUI process; calling it
          # with & does not reliably wait or refresh PowerShell's LASTEXITCODE.
          $candidate = (Resolve-Path ".\dist\InstaCleanerPro.exe").Path
          $result = Start-Process -FilePath $candidate -ArgumentList "--healthcheck" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Integrated Windows executable healthcheck exited $($result.ExitCode)." }
      - name: Bundle integrated one-click application and instructions
        shell: pwsh
        run: |
          Copy-Item dist/InstaCleanerPro.exe artifacts/profile-counts-preview/
          Copy-Item packaging/profile-counts/README.txt artifacts/profile-counts-preview/
          Copy-Item packaging/chrome-extension artifacts/profile-counts-preview/chrome-extension -Recurse -Force
          node tests/chrome-companion.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Chrome Companion contract failed." }
          @(
            "candidate_source_sha=${{ github.sha }}"
            "candidate_kind=unreleased_windows_preview"
            "application=Insta Cleaner Pro / Integrated Windows App + Automations + Profile Counts"
          ) | Set-Content artifacts/profile-counts-preview/BUILD-INFO.txt
          Get-FileHash artifacts/profile-counts-preview/InstaCleanerPro.exe -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash | Set-Content artifacts/profile-counts-preview/EXECUTABLE-SHA256.txt
          if (!(Test-Path artifacts/profile-counts-preview/IG-Cleaner-Pro.html)) { throw "HTML absent." }
          if (!(Test-Path artifacts/profile-counts-preview/InstaCleanerPro.exe)) { throw "Integrated Windows app absent." }
          if (!(Test-Path artifacts/profile-counts-preview/chrome-extension/manifest.json)) { throw "Chrome companion manifest absent." }
          if (!(Test-Path artifacts/profile-counts-preview/chrome-extension/popup.html)) { throw "Chrome companion popup absent." }
          if (Test-Path artifacts/profile-counts-preview/Start-Insta-Cleaner-Robot.cmd) { throw "Legacy .cmd launcher must not ship." }
          # The HTML is embedded inside the EXE, not an additional file the user must open.
          Remove-Item artifacts/profile-counts-preview/IG-Cleaner-Pro.html -Force
          if (Test-Path artifacts/profile-counts-preview/IG-Cleaner-Pro.html) { throw "HTML must not ship separately." }
          Compress-Archive -Path artifacts/profile-counts-preview/* -DestinationPath artifacts/Insta-Cleaner-Pro-Windows-Integrated-PREVIEW.zip -Force
      - name: Compile Windows Setup and prove installed app launch + uninstall
        shell: pwsh
        run: |
          $version = (Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName
          ./tools/build_windows_installer.ps1 -PayloadDir artifacts/profile-counts-preview -Version $version -AllowCurrentStablePreview
          if ($LASTEXITCODE -ne 0) { throw "Setup creation failed." }
          ./tools/test_windows_installer_wizard.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Setup-v$version.exe" -Screenshot artifacts/IG-Cleaner-Pro-Installer-EULA.png
          ./tools/test_windows_installer.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Setup-v$version.exe" -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows runtime failed QA." }
      - name: Build and smoke independent Developer Windows Setup
        shell: pwsh
        run: |
          $version = (Get-Content release/android-signing.json -Raw | ConvertFrom-Json).versionName
          ./tools/build_windows_developer_installer.ps1 -PayloadDir artifacts/profile-counts-preview -Version $version -AllowCurrentStablePreview
          ./tools/test_windows_developer_installer.ps1 -Installer "artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v$version.exe" -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Independent Developer Windows Setup/install/launch/uninstall QA failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: Insta-Cleaner-Windows-Integrated-PREVIEW-${{ github.sha }}
          path: |
            artifacts/IG-Cleaner-Pro-Windows-Setup-v*.exe
            artifacts/IG-Cleaner-Pro-Windows-Setup-v*.exe.sha256
            artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v*.exe
            artifacts/IG-Cleaner-Pro-Windows-Developer-Setup-v*.exe.sha256
            artifacts/IG-Cleaner-Pro-Developer-Installer-InstallLog.txt
            artifacts/Insta-Cleaner-Pro-Windows-Integrated-PREVIEW.zip
            artifacts/IG-Cleaner-Pro-Installer-InstallLog.txt
            artifacts/IG-Cleaner-Pro-Installer-EULA.png
          retention-days: 14
          if-no-files-found: error
